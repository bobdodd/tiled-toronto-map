<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Map</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Control Sidebar -->
    <div id="control-sidebar" class="control-sidebar" role="toolbar" aria-label="Map controls">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Map</h1>
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true" tabindex="1">
                <span class="icon hamburger-icon" style="display: none;">☰</span>
                <span class="icon close-icon">✕</span>
            </button>
        </div>
        
        <div class="sidebar-content">
            <button id="toggle-tracking" class="control-button" aria-pressed="false" tabindex="2">
                <span class="icon" aria-hidden="true">📍</span>
                <span class="label">Track Location</span>
            </button>
            
            <!-- Navigation Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="navigation-content" tabindex="3">
                    <span class="icon" aria-hidden="true">🧭</span>
                    <span class="label">Navigation</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="navigation-content" class="accordion-content" hidden>
                    <div id="destination-search">
                        <label for="destination-input">Destination:</label>
                        <input type="text" id="destination-input" placeholder="Enter destination address">
                        <button id="search-button">Search</button>
                    </div>
                    <div id="directions-list" role="list"></div>
                </div>
            </div>
            
            <!-- Filter Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="filter-content" tabindex="4">
                    <span class="icon" aria-hidden="true">🎛️</span>
                    <span class="label">Filters</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="filter-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Show map features by category</legend>
                        <div id="filter-groups"></div>
                    </fieldset>
                </div>
            </div>
            
            <!-- Rotor Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="rotor-content" tabindex="5">
                    <span class="icon" aria-hidden="true">🎯</span>
                    <span class="label">Rotor</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="rotor-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Navigate by category or feature type</legend>
                        
                        <!-- Clear All button -->
                        <button type="button" class="clear-all-rotor" aria-label="Clear all rotor selections">
                            <span class="icon" aria-hidden="true">🗑️</span>
                            Clear All
                        </button>
                        
                        <!-- Accessibility -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-accessibility-content">
                                <span class="icon" aria-hidden="true">♿</span>
                                <span class="label">Accessibility</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-accessibility-content" class="filter-accordion-content" hidden>
                                <!-- Audio & Visual Aids -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-audio-visual-content">
                                        <span class="icon" aria-hidden="true">🔊</span>
                                        <span class="label">Audio & Visual Aids</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-audio-visual-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-audio-signals"> Audio Crossing Signals</label>
                                        <label><input type="checkbox" id="rotor-digital-clocks"> Digital Clocks</label>
                                        <label><input type="checkbox" id="rotor-info-points"> Information Points</label>
                                        <label><input type="checkbox" id="rotor-tactile-maps"> Tactile Maps</label>
                                    </div>
                                </div>
                                
                                <!-- Emergency & Safety -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-emergency-safety-content">
                                        <span class="icon" aria-hidden="true">🆘</span>
                                        <span class="label">Emergency & Safety</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-emergency-safety-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-accessible-medical"> Accessible Medical</label>
                                        <label><input type="checkbox" id="rotor-barriers"> Barriers & Obstacles</label>
                                        <label><input type="checkbox" id="rotor-defibrillators"> Defibrillators</label>
                                        <label><input type="checkbox" id="rotor-emergency-phones"> Emergency Phones</label>
                                    </div>
                                </div>
                                
                                <!-- Navigation & Mobility -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-navigation-mobility-content">
                                        <span class="icon" aria-hidden="true">🚶</span>
                                        <span class="label">Navigation & Mobility</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-navigation-mobility-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-wheelchair-yes"> Wheelchair Accessible</label>
                                        <label><input type="checkbox" id="rotor-wheelchair-no"> Not Wheelchair Accessible</label>
                                        <label><input type="checkbox" id="rotor-wheelchair-limited"> Limited Accessibility</label>
                                        <label><input type="checkbox" id="rotor-ramps"> Ramps (All Types)</label>
                                        <label><input type="checkbox" id="rotor-handrails"> Handrails</label>
                                        <label><input type="checkbox" id="rotor-crossings"> Pedestrian Crossings</label>
                                        <label><input type="checkbox" id="rotor-curb-cuts"> Curb Cuts & Ramps</label>
                                        <label><input type="checkbox" id="rotor-elevators"> Elevators</label>
                                        <label><input type="checkbox" id="rotor-steps"> Steps & Handrails</label>
                                        <label><input type="checkbox" id="rotor-tactile-paving"> Tactile Paving</label>
                                    </div>
                                </div>
                                
                                <!-- Public Facilities -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-public-facilities-content">
                                        <span class="icon" aria-hidden="true">🚻</span>
                                        <span class="label">Public Facilities</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-public-facilities-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-accessible-parking"> Accessible Parking</label>
                                        <label><input type="checkbox" id="rotor-accessible-toilets"> Accessible Toilets</label>
                                        <label><input type="checkbox" id="rotor-changing-tables"> Changing Tables</label>
                                        <label><input type="checkbox" id="rotor-automatic-doors"> Automatic Doors</label>
                                        <label><input type="checkbox" id="rotor-wide-doors"> Wide Doorways</label>
                                        <label><input type="checkbox" id="rotor-low-kerbs"> Low Kerbs</label>
                                        <label><input type="checkbox" id="rotor-gentle-inclines"> Gentle Inclines</label>
                                        <label><input type="checkbox" id="rotor-benches"> Benches & Rest Areas</label>
                                        <label><input type="checkbox" id="rotor-drinking-water"> Drinking Water</label>
                                        <label><input type="checkbox" id="rotor-shelters"> Shelters</label>
                                    </div>
                                </div>
                                
                                <!-- Accessible Transport -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-accessible-transport-content">
                                        <span class="icon" aria-hidden="true">🚌</span>
                                        <span class="label">Accessible Transport</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-accessible-transport-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-disabled-parking"> Disabled Parking Capacity</label>
                                        <label><input type="checkbox" id="rotor-priority-disabled"> Priority Disabled Access</label>
                                        <label><input type="checkbox" id="rotor-accessible-bus"> Wheelchair Accessible Bus</label>
                                        <label><input type="checkbox" id="rotor-accessible-subway"> Wheelchair Accessible Subway</label>
                                        <label><input type="checkbox" id="rotor-accessible-tram"> Wheelchair Accessible Tram</label>
                                        <label><input type="checkbox" id="rotor-accessible-train"> Wheelchair Accessible Train</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Accommodation & Tourism -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-tourism-content">
                                <span class="icon" aria-hidden="true">🏨</span>
                                <span class="label">Accommodation & Tourism</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-tourism-content" class="filter-accordion-content" hidden>
                                <!-- Accommodation -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-accommodation-content">
                                        <span class="icon" aria-hidden="true">🛏️</span>
                                        <span class="label">Accommodation</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-accommodation-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-campsites"> Campsites</label>
                                        <label><input type="checkbox" id="rotor-guest-houses"> Guest Houses</label>
                                        <label><input type="checkbox" id="rotor-hostels"> Hostels</label>
                                        <label><input type="checkbox" id="rotor-hotels"> Hotels</label>
                                    </div>
                                </div>
                                
                                <!-- Attractions & Culture -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-attractions-content">
                                        <span class="icon" aria-hidden="true">🎭</span>
                                        <span class="label">Attractions & Culture</span>
                                        <span class="accordion-arrow">▼</span>

                                    <div id="rotor-attractions-content" class="filter-sub-accordion-content" hidden>

                                        <label><input type="checkbox" id="rotor-museums"> Museums</label>
                                        <label><input type="checkbox" id="rotor-viewpoints"> Scenic Viewpoints</label>
                                        <label><input type="checkbox" id="rotor-attractions"> Tourist Attractions</label>
                                    </div>
                                </div>
                                
                                <!-- Tourist Services -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-tourist-services-content">
                                        <span class="icon" aria-hidden="true">ℹ️</span>
                                        <span class="label">Tourist Services</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-tourist-services-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-tourist-info"> Tourist Information</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Addresses & Navigation -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-addresses-content">
                                <span class="icon" aria-hidden="true">📍</span>
                                <span class="label">Addresses & Navigation</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-addresses-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="rotor-addresses"> Addresses</label>
                            </div>
                        </div>
                        
                        <!-- Buildings & Infrastructure -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-buildings-content">
                                <span class="icon" aria-hidden="true">🏢</span>
                                <span class="label">Buildings & Infrastructure</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-buildings-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="rotor-buildings"> Buildings</label>
                            </div>
                        </div>
                        
                        <!-- Barriers -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-barriers-content">
                                <span class="label">Barriers</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-barriers-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="rotor-bollards"> Bollards</label>
                                <label><input type="checkbox" id="rotor-fences"> Fences</label>
                                <label><input type="checkbox" id="rotor-gates"> Gates</label>
                                <label><input type="checkbox" id="rotor-hedges"> Hedges</label>
                                <label><input type="checkbox" id="rotor-walls"> Walls</label>
                            </div>
                        </div>
                        
                        <!-- Commerce & Services -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-commerce-content">
                                <span class="icon" aria-hidden="true">🛍️</span>
                                <span class="label">Commerce & Services</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-commerce-content" class="filter-accordion-content" hidden>
                                <!-- Financial Services -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-financial-services-content">
                                        <span class="icon" aria-hidden="true">🏦</span>
                                        <span class="label">Financial Services</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-financial-services-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-atms"> ATMs</label>
                                        <label><input type="checkbox" id="rotor-banks"> Banks</label>
                                        <label><input type="checkbox" id="rotor-currency-exchange"> Currency Exchange</label>
                                        <label><input type="checkbox" id="rotor-post-offices"> Post Offices</label>
                                    </div>
                                </div>
                                
                                <!-- Retail -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-retail-content">
                                        <span class="icon" aria-hidden="true">🛍️</span>
                                        <span class="label">Retail</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-retail-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-shops"> Shops</label>
                                    </div>
                                </div>
                                
                                <!-- Sustenance & Food -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-sustenance-content">
                                        <span class="icon" aria-hidden="true">🍽️</span>
                                        <span class="label">Sustenance & Food</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-sustenance-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="rotor-bars"> Bars</label>
                                        <label><input type="checkbox" id="rotor-cafes"> Cafes</label>
                                        <label><input type="checkbox" id="rotor-fast-food"> Fast Food</label>
                                        <label><input type="checkbox" id="rotor-food-courts"> Food Courts</label>
                                        <label><input type="checkbox" id="rotor-pubs"> Pubs</label>
                                        <label><input type="checkbox" id="rotor-restaurants"> Restaurants</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Education & Culture -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-education-content">
                                <span class="icon" aria-hidden="true">🏫</span>
                                <span class="label">Education & Culture</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-education-content" class="filter-accordion-content" hidden>
                                <!-- Community & Arts -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-community-arts-content">
                                        <span class="icon" aria-hidden="true">🎨</span>
                                        <span class="label">Community & Arts</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-community-arts-content" class="filter-sub-accordion-content" hidden>

                                        <label><input type="checkbox" id="rotor-community-centres"> Community Centres</label>
                                    </div>
                                </div>
                                
                                <!-- Education -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="rotor-education-sub-content">
                                        <span class="icon" aria-hidden="true">📚</span>
                                        <span class="label">Education</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="rotor-education-sub-content" class="filter-sub-accordion-content" hidden>

                                        <label><input type="checkbox" id="rotor-schools"> Schools</label>
                                    </div>
                                </div>
                                
                                <!-- Entertainment -->
                                <div class="filter-sub-accordion-item">

                                        <label><input type="checkbox" id="rotor-theatres"> Theatres</label>
                                    </div>
                                </div>
                                
                                <!-- Sports & Recreation -->

                                        <span class="accordion-arrow">▼</span>
                                    </button>

                                        <label><input type="checkbox" id="rotor-golf-courses"> Golf Courses</label>
                                        <label><input type="checkbox" id="rotor-sports-centres"> Sports Centres</label>
                                        <label><input type="checkbox" id="rotor-stadiums"> Stadiums</label>

                        <!-- Emergency Services -->

                                <span class="icon" aria-hidden="true">🚨</span>
                                <span class="label">Emergency Services</span>
                                <span class="accordion-arrow">▼</span>
                            </button>

                                <label><input type="checkbox" id="rotor-emergency-defibrillators"> Emergency Defibrillators</label>
                                <label><input type="checkbox" id="rotor-emergency-phones-civil"> Emergency Phones</label>
                                <label><input type="checkbox" id="rotor-fire-stations"> Fire Stations</label>
                                <label><input type="checkbox" id="rotor-police-stations"> Police Stations</label>
                            </div>
                        </div>
                        
                        <!-- Healthcare -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-healthcare-content">
                                <span class="icon" aria-hidden="true">🏥</span>

                                <label><input type="checkbox" id="rotor-dentists"> Dentists</label>
                                <label><input type="checkbox" id="rotor-doctors"> Doctors</label>
                                <label><input type="checkbox" id="rotor-hospitals"> Hospitals</label>
                                <label><input type="checkbox" id="rotor-pharmacies"> Pharmacies</label>
                                <label><input type="checkbox" id="rotor-veterinary"> Veterinary</label>
                            </div>
                        </div>
                        
                        <!-- Historic Features -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="rotor-historic-content">
                                <span class="icon" aria-hidden="true">🏛️</span>
                                <span class="label">Historic Features</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="rotor-historic-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="rotor-archaeological-sites"> Archaeological Sites</label>
                                <label><input type="checkbox" id="rotor-castles"> Castles</label>

                        <!-- Man-made Structures -->
                        <div class="filter-accordion-item">

    <main>
        <div id="map-container" role="application" aria-label="Interactive map">
            <svg id="map-svg" role="document" focusable="true"
                 width="100%" height="100%" viewBox="0 0 800 600"
                 xmlns="http://www.w3.org/2000/svg">
                <g id="map-tiles"></g>
                <g id="map-features"></g>
                <g id="map-labels"></g>
                <g id="user-location"></g>
                <g id="navigation-route"></g>
            </svg>
            
            <!-- Compass Navigator -->
            <div id="compass-navigator" class="compass-navigator" role="group" aria-label="Map navigation compass">
                <div class="compass-ring">
                    <button id="nav-n" class="nav-button nav-n" aria-label="Pan north" tabindex="7">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-ne" class="nav-button nav-ne" aria-label="Pan northeast" tabindex="8">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(45 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-e" class="nav-button nav-e" aria-label="Pan east" tabindex="9">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 12 L12 8 L14 12 L12 16 Z"/>
                        </svg>
                    </button>
                    <button id="nav-se" class="nav-button nav-se" aria-label="Pan southeast" tabindex="10">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-s" class="nav-button nav-s" aria-label="Pan south" tabindex="11">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 20 L16 12 L12 14 L8 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-sw" class="nav-button nav-sw" aria-label="Pan southwest" tabindex="12">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-w" class="nav-button nav-w" aria-label="Pan west" tabindex="13">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 12 L12 16 L10 12 L12 8 Z"/>
                        </svg>
                    </button>
                    <button id="nav-nw" class="nav-button nav-nw" aria-label="Pan northwest" tabindex="14">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-45 12 12)"/>
                        </svg>
                    </button>
                </div>
                <div class="nav-center">
                    <button id="nav-zoom-in" class="nav-zoom nav-zoom-in" aria-label="Zoom in" tabindex="15">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M10 3 v14 M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-in-outline" aria-hidden="true"></div>
                    
                    <button id="nav-zoom-out" class="nav-zoom nav-zoom-out" aria-label="Zoom out" tabindex="16">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-out-outline" aria-hidden="true"></div>
                    
                    <button id="nav-center" class="nav-center-btn" aria-label="Center on current location" tabindex="17">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <circle cx="10" cy="10" r="3"/>
                            <path d="M10 2 v4 M10 14 v4 M2 10 h4 M14 10 h4" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        

        <div id="location-info" class="location-info" aria-live="polite" aria-atomic="true">
            <p>Current location: <span id="current-location">Unknown</span></p>
            <p>Accuracy: <span id="location-accuracy">N/A</span></p>
        </div>
    </main>

    <div id="debug-panel" class="debug-panel" style="display: none;">
        <h3>Debug Controls</h3>
        <label for="lat-input">Latitude:</label>
        <input type="number" id="lat-input" step="0.0001" value="40.7128">
        <label for="lng-input">Longitude:</label>
        <input type="number" id="lng-input" step="0.0001" value="-74.0060">
        <button id="set-location">Set Location</button>
    </div>

    <!-- Pako library for gzip decompression fallback (self-hosted, no CDN) -->
    <script src="vendor/pako.min.js"></script>
    <script type="module" src="src/app.js"></script>
    
    <!-- Live region for announcements -->
    <div id="map-announcements" aria-live="polite" aria-atomic="true" class="screen-reader-only"></div>
</body>
