<!DOCTYPE html>
<html>
<head>
    <title>SVG Debug Test</title>
    <style>
        body { margin: 0; padding: 0; }
        #container { width: 100vw; height: 100vh; background: #ccc; }
        svg { width: 100%; height: 100%; background: white; display: block; }
    </style>
</head>
<body>
    <div id="container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <g id="tiles">
                <!-- Manually place some tiles -->
                <image href="https://tile.openstreetmap.org/15/9649/12318.png" x="0" y="0" width="256" height="256"/>
                <image href="https://tile.openstreetmap.org/15/9650/12318.png" x="256" y="0" width="256" height="256"/>
                <image href="https://tile.openstreetmap.org/15/9649/12319.png" x="0" y="256" width="256" height="256"/>
                <image href="https://tile.openstreetmap.org/15/9650/12319.png" x="256" y="256" width="256" height="256"/>
            </g>
        </svg>
    </div>
    
    <script>
        // Test dynamic tile loading
        setTimeout(() => {
            const svg = document.querySelector('svg');
            const tiles = svg.querySelector('#tiles');
            
            // Add a tile dynamically
            const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
            img.setAttribute('href', 'https://tile.openstreetmap.org/15/9651/12318.png');
            img.setAttribute('x', '512');
            img.setAttribute('y', '0');
            img.setAttribute('width', '256');
            img.setAttribute('height', '256');
            tiles.appendChild(img);
            
            console.log('Added tile dynamically');
        }, 1000);
    </script>
</body>
</html>
