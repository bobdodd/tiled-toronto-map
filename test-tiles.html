<!DOCTYPE html>
<html>
<head>
    <title>Tile Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #ccc; }
        .tile-test { 
            display: inline-block; 
            margin: 5px;
            border: 1px solid red;
        }
        img { display: block; }
    </style>
</head>
<body>
    <h1>OSM Tile Test</h1>
    <p>Testing if tiles have grid patterns built in:</p>
    
    <div class="tile-test">
        <img src="https://tile.openstreetmap.org/15/9649/12318.png" width="256" height="256">
        <p>Tile 15/9649/12318</p>
    </div>
    
    <div class="tile-test">
        <img src="https://tile.openstreetmap.org/15/9650/12318.png" width="256" height="256">
        <p>Tile 15/9650/12318</p>
    </div>
    
    <h2>SVG Test</h2>
    <svg width="512" height="256" style="border: 1px solid blue; background: white;">
        <image href="https://tile.openstreetmap.org/15/9649/12318.png" x="0" y="0" width="256" height="256"/>
        <image href="https://tile.openstreetmap.org/15/9650/12318.png" x="256" y="0" width="256" height="256"/>
    </svg>
</body>
</html>
