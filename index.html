<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Map</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="skip-link">
        <a href="#map-container">Skip to map</a>
    </div>
    
    <header role="banner">
        <h1>Interactive Map</h1>
        <nav role="navigation" aria-label="Map controls">
            <button id="toggle-tracking" aria-pressed="false">
                <span class="icon" aria-hidden="true">📍</span>
                <span>Track Location</span>
            </button>
            <button id="toggle-navigation" aria-pressed="false">
                <span class="icon" aria-hidden="true">🧭</span>
                <span>Navigation</span>
            </button>
            <button id="toggle-contrast" aria-pressed="false">
                <span class="icon" aria-hidden="true">🎨</span>
                <span>High Contrast</span>
            </button>
            
            <!-- Filter Controls -->
            <div class="filter-container" aria-labelledby="filter-heading">
                <h2 class="screen-reader-only" id="filter-heading">Map filters</h2>
                <button class="filter-button" aria-expanded="false" aria-controls="filter-panel">
                    <span class="icon" aria-hidden="true">🎛️</span>
                    <span>Filters</span>
                </button>
                <div id="filter-panel" class="filter-panel" hidden>
                    <fieldset>
                        <legend>Show map features:</legend>
                        <label><input type="checkbox" id="filter-buildings" checked> Buildings</label>
                        <label><input type="checkbox" id="filter-roads" checked> Roads</label>
                        <label><input type="checkbox" id="filter-transit" checked> Transit Stops</label>
                        <label><input type="checkbox" id="filter-shops"> Shops</label>
                        <label><input type="checkbox" id="filter-schools"> Schools</label>
                        <label><input type="checkbox" id="filter-worship"> Places of Worship</label>
                        <label><input type="checkbox" id="filter-parks"> Parks & Recreation</label>
                        <label><input type="checkbox" id="filter-addresses"> Addresses</label>
                    </fieldset>
                </div>
            </div>
            
            <!-- Rotor Controls -->
            <div class="rotor-container" aria-labelledby="rotor-heading">
                <h2 class="screen-reader-only" id="rotor-heading">Navigation rotor</h2>
                <button class="rotor-button" aria-expanded="false" aria-controls="rotor-panel">
                    <span class="icon" aria-hidden="true">🎯</span>
                    <span>Rotor</span>
                </button>
                <div id="rotor-panel" class="rotor-panel" hidden>
                    <fieldset>
                        <legend>Navigate by:</legend>
                        <label><input type="radio" name="rotor" value="none" checked> No selection</label>
                        <label><input type="radio" name="rotor" value="transit"> Transit stops</label>
                        <label><input type="radio" name="rotor" value="shops"> Shops</label>
                        <label><input type="radio" name="rotor" value="schools"> Schools</label>
                        <label><input type="radio" name="rotor" value="worship"> Places of Worship</label>
                        <label><input type="radio" name="rotor" value="parks"> Parks</label>
                        <label><input type="radio" name="rotor" value="everything"> Everything</label>
                    </fieldset>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div id="map-container" role="application" aria-label="Interactive map" tabindex="0">
            <svg id="map-svg" role="document" aria-labelledby="map-heading" focusable="true"
                 width="100%" height="600" viewBox="0 0 800 600"
                 xmlns="http://www.w3.org/2000/svg">
                <title id="map-heading">Interactive street map</title>
                <g id="map-tiles" aria-label="Map tiles"></g>
                <g id="map-features" aria-label="Map features"></g>
                <g id="map-labels" aria-label="Map labels"></g>
                <g id="user-location" aria-label="User location"></g>
                <g id="navigation-route" aria-label="Navigation route"></g>
            </svg>
            <div id="map-controls" class="map-controls">
                <button id="zoom-in" aria-label="Zoom in">+</button>
                <button id="zoom-out" aria-label="Zoom out">−</button>
                <button id="center-location" aria-label="Center on current location">⊙</button>
            </div>
        </div>
        
        <aside id="navigation-panel" class="navigation-panel" aria-live="polite" aria-label="Navigation instructions">
            <h2>Navigation</h2>
            <div id="destination-search">
                <label for="destination-input">Destination:</label>
                <input type="text" id="destination-input" placeholder="Enter destination address">
                <button id="search-button">Search</button>
            </div>
            <div id="directions-list" role="list"></div>
        </aside>

        <div id="location-info" class="location-info" aria-live="polite" aria-atomic="true">
            <p>Current location: <span id="current-location">Unknown</span></p>
            <p>Accuracy: <span id="location-accuracy">N/A</span></p>
        </div>
    </main>

    <div id="debug-panel" class="debug-panel" style="display: none;">
        <h3>Debug Controls</h3>
        <label for="lat-input">Latitude:</label>
        <input type="number" id="lat-input" step="0.0001" value="40.7128">
        <label for="lng-input">Longitude:</label>
        <input type="number" id="lng-input" step="0.0001" value="-74.0060">
        <button id="set-location">Set Location</button>
    </div>

    <script type="module" src="src/app.js"></script>
    
    <!-- Live region for announcements -->
    <div id="map-announcements" aria-live="polite" aria-atomic="true" class="screen-reader-only"></div>
</body>
</html>
