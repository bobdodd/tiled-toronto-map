<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Map</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Control Sidebar -->
    <div id="control-sidebar" class="control-sidebar" role="toolbar" aria-label="Map controls">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Map</h1>
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true" tabindex="1">
                <span class="icon hamburger-icon" style="display: none;">☰</span>
                <span class="icon close-icon">✕</span>
            </button>
        </div>
        
        <div class="sidebar-content">
            <button id="toggle-tracking" class="control-button" aria-pressed="false" tabindex="2">
                <span class="icon" aria-hidden="true">📍</span>
                <span class="label">Track Location</span>
            </button>
            
            <!-- Navigation Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="navigation-content" tabindex="3">
                    <span class="icon" aria-hidden="true">🧭</span>
                    <span class="label">Navigation</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="navigation-content" class="accordion-content" hidden>
                    <div id="destination-search">
                        <label for="destination-input">Destination:</label>
                        <input type="text" id="destination-input" placeholder="Enter destination address">
                        <button id="search-button">Search</button>
                    </div>
                    <div id="directions-list" role="list"></div>
                </div>
            </div>
            
            <!-- Filter Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="filter-content" tabindex="4">
                    <span class="icon" aria-hidden="true">🎛️</span>
                    <span class="label">Filters</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="filter-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Show map features</legend>
                        <label><input type="checkbox" id="filter-buildings" checked> Buildings</label>
                        <label><input type="checkbox" id="filter-roads" checked> Roads</label>
                        <label><input type="checkbox" id="filter-transit" checked> Transit Stops</label>
                        <label><input type="checkbox" id="filter-shops" checked> Shops</label>
                        <label><input type="checkbox" id="filter-schools" checked> Schools</label>
                        <label><input type="checkbox" id="filter-worship" checked> Places of Worship</label>
                        <label><input type="checkbox" id="filter-parks" checked> Parks & Recreation</label>
                        <label><input type="checkbox" id="filter-addresses" checked> Addresses</label>
                    </fieldset>
                </div>
            </div>
            
            <!-- Rotor Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="rotor-content" tabindex="5">
                    <span class="icon" aria-hidden="true">🎯</span>
                    <span class="label">Rotor</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="rotor-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Navigate by</legend>
                        <label><input type="radio" name="rotor" value="none" checked> No selection</label>
                        <label><input type="radio" name="rotor" value="transit"> Transit stops</label>
                        <label><input type="radio" name="rotor" value="shops"> Shops</label>
                        <label><input type="radio" name="rotor" value="schools"> Schools</label>
                        <label><input type="radio" name="rotor" value="worship"> Places of Worship</label>
                        <label><input type="radio" name="rotor" value="parks"> Parks</label>
                        <label><input type="radio" name="rotor" value="everything"> Everything</label>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>

    <main>
        <div id="map-container" role="application" aria-label="Interactive map">
            <svg id="map-svg" role="document" aria-labelledby="map-heading" focusable="true"
                 width="100%" height="100%" viewBox="0 0 800 600"
                 xmlns="http://www.w3.org/2000/svg">
                <title id="map-heading">Interactive street map</title>
                <g id="map-tiles" aria-label="Map tiles"></g>
                <g id="map-features" aria-label="Map features"></g>
                <g id="map-labels" aria-label="Map labels"></g>
                <g id="user-location" aria-label="User location"></g>
                <g id="navigation-route" aria-label="Navigation route"></g>
            </svg>
            
            <!-- Compass Navigator -->
            <div id="compass-navigator" class="compass-navigator" role="group" aria-label="Map navigation compass">
                <div class="compass-ring">
                    <button id="nav-n" class="nav-button nav-n" aria-label="Pan north" tabindex="7">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-ne" class="nav-button nav-ne" aria-label="Pan northeast" tabindex="8">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(45 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-e" class="nav-button nav-e" aria-label="Pan east" tabindex="9">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 12 L12 8 L14 12 L12 16 Z"/>
                        </svg>
                    </button>
                    <button id="nav-se" class="nav-button nav-se" aria-label="Pan southeast" tabindex="10">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-s" class="nav-button nav-s" aria-label="Pan south" tabindex="11">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 20 L16 12 L12 14 L8 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-sw" class="nav-button nav-sw" aria-label="Pan southwest" tabindex="12">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-w" class="nav-button nav-w" aria-label="Pan west" tabindex="13">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 12 L12 16 L10 12 L12 8 Z"/>
                        </svg>
                    </button>
                    <button id="nav-nw" class="nav-button nav-nw" aria-label="Pan northwest" tabindex="14">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-45 12 12)"/>
                        </svg>
                    </button>
                </div>
                <div class="nav-center">
                    <button id="nav-zoom-in" class="nav-zoom nav-zoom-in" aria-label="Zoom in" tabindex="15">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M10 3 v14 M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-in-outline" aria-hidden="true"></div>
                    
                    <button id="nav-zoom-out" class="nav-zoom nav-zoom-out" aria-label="Zoom out" tabindex="16">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-out-outline" aria-hidden="true"></div>
                    
                    <button id="nav-center" class="nav-center-btn" aria-label="Center on current location" tabindex="17">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <circle cx="10" cy="10" r="3"/>
                            <path d="M10 2 v4 M10 14 v4 M2 10 h4 M14 10 h4" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        

        <div id="location-info" class="location-info" aria-live="polite" aria-atomic="true">
            <p>Current location: <span id="current-location">Unknown</span></p>
            <p>Accuracy: <span id="location-accuracy">N/A</span></p>
        </div>
    </main>

    <div id="debug-panel" class="debug-panel" style="display: none;">
        <h3>Debug Controls</h3>
        <label for="lat-input">Latitude:</label>
        <input type="number" id="lat-input" step="0.0001" value="40.7128">
        <label for="lng-input">Longitude:</label>
        <input type="number" id="lng-input" step="0.0001" value="-74.0060">
        <button id="set-location">Set Location</button>
    </div>

    <script type="module" src="src/app.js"></script>
    
    <!-- Live region for announcements -->
    <div id="map-announcements" aria-live="polite" aria-atomic="true" class="screen-reader-only"></div>
</body>
</html>
