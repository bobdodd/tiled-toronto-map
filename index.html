<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Interactive Map</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Control Sidebar -->
    <div id="control-sidebar" class="control-sidebar" role="toolbar" aria-label="Map controls">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Map</h1>
            <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true" tabindex="1">
                <span class="icon hamburger-icon" style="display: none;">☰</span>
                <span class="icon close-icon">✕</span>
            </button>
        </div>
        
        <div class="sidebar-content">
            <button id="toggle-tracking" class="control-button" aria-pressed="false" tabindex="2">
                <span class="icon" aria-hidden="true">📍</span>
                <span class="label">Track Location</span>
            </button>
            
            <!-- Navigation Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="navigation-content" tabindex="3">
                    <span class="icon" aria-hidden="true">🧭</span>
                    <span class="label">Navigation</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="navigation-content" class="accordion-content" hidden>
                    <div id="destination-search">
                        <label for="destination-input">Destination:</label>
                        <input type="text" id="destination-input" placeholder="Enter destination address">
                        <button id="search-button">Search</button>
                    </div>
                    <div id="directions-list" role="list"></div>
                </div>
            </div>
            
            <!-- Filter Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="filter-content" tabindex="4">
                    <span class="icon" aria-hidden="true">🎛️</span>
                    <span class="label">Filters</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="filter-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Show map features by category</legend>
                        
                        <!-- Accessibility -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="accessibility-filter-content">
                                <span class="icon" aria-hidden="true">♿</span>
                                <span class="label">Accessibility</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="accessibility-filter-content" class="filter-accordion-content" hidden>
                                <!-- Public Facilities -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="public-facilities-content">
                                        <span class="icon" aria-hidden="true">🚻</span>
                                        <span class="label">Public Facilities</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="public-facilities-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="filter-accessible-parking" checked> Accessible Parking</label>
                                        <label><input type="checkbox" id="filter-accessible-toilets" checked> Accessible Toilets</label>
                                        <label><input type="checkbox" id="filter-benches" checked> Benches & Rest Areas</label>
                                        <label><input type="checkbox" id="filter-drinking-water" checked> Drinking Water</label>
                                        <label><input type="checkbox" id="filter-shelters" checked> Shelters</label>
                                    </div>
                                </div>
                                
                                <!-- Navigation & Mobility -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="navigation-mobility-content">
                                        <span class="icon" aria-hidden="true">🚶</span>
                                        <span class="label">Navigation & Mobility</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="navigation-mobility-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="filter-curb-cuts" checked> Curb Cuts & Ramps</label>
                                        <label><input type="checkbox" id="filter-elevators" checked> Elevators</label>
                                        <label><input type="checkbox" id="filter-crossings" checked> Pedestrian Crossings</label>
                                        <label><input type="checkbox" id="filter-steps" checked> Steps & Handrails</label>
                                        <label><input type="checkbox" id="filter-tactile-paving" checked> Tactile Paving</label>
                                    </div>
                                </div>
                                
                                <!-- Audio & Visual Aids -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="audio-visual-content">
                                        <span class="icon" aria-hidden="true">🔊</span>
                                        <span class="label">Audio & Visual Aids</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="audio-visual-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="filter-audio-signals" checked> Audio Crossing Signals</label>
                                        <label><input type="checkbox" id="filter-digital-clocks" checked> Digital Clocks</label>
                                        <label><input type="checkbox" id="filter-info-points" checked> Information Points</label>
                                        <label><input type="checkbox" id="filter-tactile-maps" checked> Tactile Maps</label>
                                    </div>
                                </div>
                                
                                <!-- Emergency & Safety -->
                                <div class="filter-sub-accordion-item">
                                    <button class="filter-sub-accordion-header" aria-expanded="false" aria-controls="emergency-safety-content">
                                        <span class="icon" aria-hidden="true">🆘</span>
                                        <span class="label">Emergency & Safety</span>
                                        <span class="accordion-arrow">▼</span>
                                    </button>
                                    <div id="emergency-safety-content" class="filter-sub-accordion-content" hidden>
                                        <label><input type="checkbox" id="filter-accessible-medical" checked> Accessible Medical</label>
                                        <label><input type="checkbox" id="filter-barriers" checked> Barriers & Obstacles</label>
                                        <label><input type="checkbox" id="filter-defibrillators" checked> Defibrillators</label>
                                        <label><input type="checkbox" id="filter-emergency-phones" checked> Emergency Phones</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Addresses & Navigation -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="addresses-filter-content">
                                <span class="icon" aria-hidden="true">📍</span>
                                <span class="label">Addresses & Navigation</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="addresses-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-addresses" checked> Addresses</label>
                            </div>
                        </div>
                        
                        <!-- Buildings & Infrastructure -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="buildings-filter-content">
                                <span class="icon" aria-hidden="true">🏢</span>
                                <span class="label">Buildings & Infrastructure</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="buildings-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-buildings" checked> Buildings</label>
                            </div>
                        </div>
                        
                        <!-- Commerce & Services -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="commerce-filter-content">
                                <span class="icon" aria-hidden="true">🛍️</span>
                                <span class="label">Commerce & Services</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="commerce-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-shops" checked> Shops</label>
                            </div>
                        </div>
                        
                        <!-- Education & Culture -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="education-filter-content">
                                <span class="icon" aria-hidden="true">🏫</span>
                                <span class="label">Education & Culture</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="education-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-schools" checked> Schools</label>
                            </div>
                        </div>
                        
                        <!-- Healthcare -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="healthcare-filter-content">
                                <span class="icon" aria-hidden="true">🏥</span>
                                <span class="label">Healthcare</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="healthcare-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-clinics" checked> Clinics</label>
                                <label><input type="checkbox" id="filter-dentists" checked> Dentists</label>
                                <label><input type="checkbox" id="filter-doctors" checked> Doctors</label>
                                <label><input type="checkbox" id="filter-hospitals" checked> Hospitals</label>
                                <label><input type="checkbox" id="filter-pharmacies" checked> Pharmacies</label>
                                <label><input type="checkbox" id="filter-veterinary" checked> Veterinary</label>
                            </div>
                        </div>
                        
                        <!-- Places of Worship -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="worship-filter-content">
                                <span class="icon" aria-hidden="true">⛪</span>
                                <span class="label">Places of Worship</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="worship-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-worship" checked> Places of Worship</label>
                            </div>
                        </div>
                        
                        <!-- Recreation & Nature -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="recreation-filter-content">
                                <span class="icon" aria-hidden="true">🌳</span>
                                <span class="label">Recreation & Nature</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="recreation-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-parks" checked> Parks & Recreation</label>
                            </div>
                        </div>
                        
                        <!-- Transportation -->
                        <div class="filter-accordion-item">
                            <button class="filter-accordion-header" aria-expanded="false" aria-controls="transportation-filter-content">
                                <span class="icon" aria-hidden="true">🚗</span>
                                <span class="label">Transportation</span>
                                <span class="accordion-arrow">▼</span>
                            </button>
                            <div id="transportation-filter-content" class="filter-accordion-content" hidden>
                                <label><input type="checkbox" id="filter-roads" checked> Roads</label>
                                <label><input type="checkbox" id="filter-transit" checked> Transit Stops</label>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </div>
            
            <!-- Rotor Accordion -->
            <div class="accordion-item">
                <button class="accordion-header" aria-expanded="false" aria-controls="rotor-content" tabindex="5">
                    <span class="icon" aria-hidden="true">🎯</span>
                    <span class="label">Rotor</span>
                    <span class="accordion-arrow">▼</span>
                </button>
                <div id="rotor-content" class="accordion-content" hidden>
                    <fieldset>
                        <legend class="screen-reader-only">Navigate by category or feature type</legend>
                        
                        <label><input type="radio" name="rotor" value="none" checked> No selection</label>
                        
                        <!-- Category Groups -->
                        <div class="rotor-category">
                            <h4 class="rotor-category-title">By Category</h4>
                            <label><input type="radio" name="rotor" value="addresses"> Addresses & Navigation</label>
                            <label><input type="radio" name="rotor" value="buildings"> Buildings & Infrastructure</label>
                            <label><input type="radio" name="rotor" value="commerce"> Commerce & Services</label>
                            <label><input type="radio" name="rotor" value="education"> Education & Culture</label>
                            <label><input type="radio" name="rotor" value="healthcare"> Healthcare</label>
                            <label><input type="radio" name="rotor" value="worship"> Places of Worship</label>
                            <label><input type="radio" name="rotor" value="recreation"> Recreation & Nature</label>
                            <label><input type="radio" name="rotor" value="transportation"> Transportation</label>
                        </div>
                        
                        <!-- Individual Feature Types -->
                        <div class="rotor-category">
                            <h4 class="rotor-category-title">By Feature Type</h4>
                            <label><input type="radio" name="rotor" value="hospitals"> Hospitals only</label>
                            <label><input type="radio" name="rotor" value="parks"> Parks only</label>
                            <label><input type="radio" name="rotor" value="pharmacies"> Pharmacies only</label>
                            <label><input type="radio" name="rotor" value="schools"> Schools only</label>
                            <label><input type="radio" name="rotor" value="shops"> Shops only</label>
                            <label><input type="radio" name="rotor" value="transit"> Transit stops only</label>
                        </div>
                        
                        <!-- Accessibility Features -->
                        <div class="rotor-category">
                            <h4 class="rotor-category-title">Accessibility Features</h4>
                            <label><input type="radio" name="rotor" value="accessibility-all"> All Accessibility Features</label>
                            <label><input type="radio" name="rotor" value="essential-navigation"> Essential Navigation</label>
                            <label><input type="radio" name="rotor" value="public-facilities"> Public Facilities</label>
                            <label><input type="radio" name="rotor" value="emergency-features"> Emergency Features</label>
                        </div>
                        
                        <label><input type="radio" name="rotor" value="everything"> Everything</label>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>

    <main>
        <div id="map-container" role="application" aria-label="Interactive map">
            <svg id="map-svg" role="document" aria-labelledby="map-heading" focusable="true"
                 width="100%" height="100%" viewBox="0 0 800 600"
                 xmlns="http://www.w3.org/2000/svg">
                <title id="map-heading">Interactive street map</title>
                <g id="map-tiles" aria-label="Map tiles"></g>
                <g id="map-features" aria-label="Map features"></g>
                <g id="map-labels" aria-label="Map labels"></g>
                <g id="user-location" aria-label="User location"></g>
                <g id="navigation-route" aria-label="Navigation route"></g>
            </svg>
            
            <!-- Compass Navigator -->
            <div id="compass-navigator" class="compass-navigator" role="group" aria-label="Map navigation compass">
                <div class="compass-ring">
                    <button id="nav-n" class="nav-button nav-n" aria-label="Pan north" tabindex="7">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-ne" class="nav-button nav-ne" aria-label="Pan northeast" tabindex="8">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(45 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-e" class="nav-button nav-e" aria-label="Pan east" tabindex="9">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 12 L12 8 L14 12 L12 16 Z"/>
                        </svg>
                    </button>
                    <button id="nav-se" class="nav-button nav-se" aria-label="Pan southeast" tabindex="10">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-s" class="nav-button nav-s" aria-label="Pan south" tabindex="11">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 20 L16 12 L12 14 L8 12 Z"/>
                        </svg>
                    </button>
                    <button id="nav-sw" class="nav-button nav-sw" aria-label="Pan southwest" tabindex="12">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-135 12 12)"/>
                        </svg>
                    </button>
                    <button id="nav-w" class="nav-button nav-w" aria-label="Pan west" tabindex="13">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 12 L12 16 L10 12 L12 8 Z"/>
                        </svg>
                    </button>
                    <button id="nav-nw" class="nav-button nav-nw" aria-label="Pan northwest" tabindex="14">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 4 L8 12 L12 10 L16 12 Z" transform="rotate(-45 12 12)"/>
                        </svg>
                    </button>
                </div>
                <div class="nav-center">
                    <button id="nav-zoom-in" class="nav-zoom nav-zoom-in" aria-label="Zoom in" tabindex="15">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M10 3 v14 M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-in-outline" aria-hidden="true"></div>
                    
                    <button id="nav-zoom-out" class="nav-zoom nav-zoom-out" aria-label="Zoom out" tabindex="16">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M3 10 h14" stroke-width="2"/>
                        </svg>
                    </button>
                    <div class="zoom-out-outline" aria-hidden="true"></div>
                    
                    <button id="nav-center" class="nav-center-btn" aria-label="Center on current location" tabindex="17">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <circle cx="10" cy="10" r="3"/>
                            <path d="M10 2 v4 M10 14 v4 M2 10 h4 M14 10 h4" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        

        <div id="location-info" class="location-info" aria-live="polite" aria-atomic="true">
            <p>Current location: <span id="current-location">Unknown</span></p>
            <p>Accuracy: <span id="location-accuracy">N/A</span></p>
        </div>
    </main>

    <div id="debug-panel" class="debug-panel" style="display: none;">
        <h3>Debug Controls</h3>
        <label for="lat-input">Latitude:</label>
        <input type="number" id="lat-input" step="0.0001" value="40.7128">
        <label for="lng-input">Longitude:</label>
        <input type="number" id="lng-input" step="0.0001" value="-74.0060">
        <button id="set-location">Set Location</button>
    </div>

    <script type="module" src="src/app.js"></script>
    
    <!-- Live region for announcements -->
    <div id="map-announcements" aria-live="polite" aria-atomic="true" class="screen-reader-only"></div>
</body>
</html>
